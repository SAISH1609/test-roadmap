services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api

  backend:
    build: ./backend
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        python manage_db.py check-connection &&
        echo 'Checking and creating tables if needed...' &&
        python manage_db.py create-tables &&
        echo 'Checking if data already exists...' &&
        if ! python manage_db.py check-data-exists | grep -q 'Found 0 records'; then
          echo 'Data already exists, skipping SQL import'
        else
          echo 'Loading data from roadmapdb_fixed.sql...' &&
          psql \"$$DATABASE_URL\" -f /app/../roadmapdb_fixed.sql
        fi &&
        echo 'Starting application...' &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./roadmapdb_fixed.sql:/app/../roadmapdb_fixed.sql
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine # Official Postgres image
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=roadmapdb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roadmapdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

